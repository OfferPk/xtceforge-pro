<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#111d33"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16243b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <text x="480" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1">XTCEFORGE PRO (v1.0.0) — SYSTEM ARCHITECTURE</text>
  <text x="480" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">CCSDS 660.0-B-2 &amp; OMG XTCE 1.2 Telemetric and Command Database Studio</text>

  <!-- Left Box: XTCE Model & Ingestion -->
  <rect x="40" y="110" width="260" height="360" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="40" y="110" width="260" height="40" rx="10" fill="#1e293b"/>
  <text x="170" y="136" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">XTCE DEFINITION MODEL</text>
  <text x="60" y="180" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• ParameterTypeSet</text>
  <text x="75" y="202" fill="#64748b" font-family="monospace" font-size="11">Integer, Float, Enum, String</text>
  <text x="60" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• SequenceContainers</text>
  <text x="75" y="262" fill="#64748b" font-family="monospace" font-size="11">Bit Offsets &amp; ParameterRefEntry</text>
  <text x="60" y="300" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Calibrator Curves</text>
  <text x="75" y="322" fill="#64748b" font-family="monospace" font-size="11">Polynomial &amp; Spline Models</text>
  <text x="60" y="360" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Command Definitions</text>
  <text x="75" y="382" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">MetaCommands &amp; ArgumentLists</text>

  <!-- Middle Box: Processing & Decommutation Engines -->
  <rect x="350" y="110" width="260" height="360" rx="10" fill="url(#cardBg)" stroke="#0284c7" stroke-width="2"/>
  <rect x="350" y="110" width="260" height="40" rx="10" fill="#0284c7"/>
  <text x="480" y="136" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PROCESSING ENGINES</text>
  <text x="370" y="180" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1. Bit-Level Decommutator</text>
  <text x="385" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Bit-shifting &amp; Sign Extension</text>
  <text x="385" y="220" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Unpacking Non-Aligned Fields</text>
  <text x="370" y="260" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">2. Calibration &amp; Alarms</text>
  <text x="385" y="282" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Raw &rarr; Engineering Conversion</text>
  <text x="385" y="300" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Warn/Crit Low/High Thresholds</text>
  <text x="370" y="340" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">3. 10-Point Normative Auditor</text>
  <text x="385" y="362" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">CCSDS 660.0-B-2 Rules 001 - 010</text>
  <text x="385" y="380" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">Automated 100% Compliance Scorecard</text>

  <!-- Right Box: Mission Control Products -->
  <rect x="660" y="110" width="260" height="360" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="660" y="110" width="260" height="40" rx="10" fill="#1e293b"/>
  <text x="790" y="136" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MISSION OUTPUTS</text>
  <text x="680" y="180" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Normative XTCE XML</text>
  <text x="695" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Standard Schema Interchange</text>
  <text x="680" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Live Decommutator UI</text>
  <text x="695" y="262" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Real-Time TM Parameter Table</text>
  <text x="680" y="300" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Telecommand Packager</text>
  <text x="695" y="322" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Binary Hex Command Serialization</text>
  <text x="680" y="360" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Python 3 CLI Utility</text>
  <text x="695" y="382" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">CI/CD Automated Packet Testing</text>

  <!-- Connectors -->
  <line x1="300" y1="290" x2="350" y2="290" stroke="#38bdf8" stroke-width="2"/>
  <line x1="610" y1="290" x2="660" y2="290" stroke="#38bdf8" stroke-width="2"/>
</svg>
