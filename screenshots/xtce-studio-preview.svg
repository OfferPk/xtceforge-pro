<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#0b1324"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="960" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="30" cy="25" r="8" fill="#38bdf8"/>
  <text x="50" y="31" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">XTCEForge Pro</text>
  <text x="175" y="31" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">v1.0.0</text>
  <text x="230" y="31" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">CCSDS 660.0-B-2 &amp; OMG XTCE 1.2 Telemetry &amp; Command Studio</text>
  <rect x="840" y="12" width="95" height="26" rx="4" fill="#059669"/>
  <text x="887" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">10/10 PASS</text>

  <!-- Left Column: Packet Dissector & Table -->
  <rect x="20" y="70" width="520" height="445" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="35" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">TELEMETRY PACKET DECOMMUTATOR &amp; ALARMS</text>

  <!-- Hex Box -->
  <rect x="35" y="112" width="490" height="32" rx="4" fill="#040812" stroke="#1e293b"/>
  <text x="45" y="132" fill="#38bdf8" font-family="monospace" font-size="11">EB900120002A031F4003E8CE49E4820840A812 (19 Bytes)</text>

  <!-- Table Header -->
  <rect x="35" y="154" width="490" height="24" fill="#0f172a"/>
  <text x="45" y="170" fill="#94a3b8" font-size="10" font-family="sans-serif">BIT RANGE</text>
  <text x="120" y="170" fill="#94a3b8" font-size="10" font-family="sans-serif">PARAMETER</text>
  <text x="260" y="170" fill="#94a3b8" font-size="10" font-family="sans-serif">RAW</text>
  <text x="350" y="170" fill="#94a3b8" font-size="10" font-family="sans-serif">CALIBRATED</text>
  <text x="460" y="170" fill="#94a3b8" font-size="10" font-family="sans-serif">STATUS</text>

  <!-- Rows -->
  <line x1="35" y1="205" x2="525" y2="205" stroke="#1e293b"/>
  <text x="45" y="198" fill="#64748b" font-family="monospace" font-size="11">0..15</text>
  <text x="120" y="198" fill="#38bdf8" font-family="monospace" font-size="11">SYNC_WORD</text>
  <text x="260" y="198" fill="#cbd5e1" font-family="monospace" font-size="11">0xEB90</text>
  <text x="350" y="198" fill="#fff" font-family="monospace" font-size="11">0xEB90</text>
  <rect x="460" y="186" width="55" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="487" y="198" fill="#10b981" font-size="9" font-family="sans-serif" text-anchor="middle">NOMINAL</text>

  <line x1="35" y1="235" x2="525" y2="235" stroke="#1e293b"/>
  <text x="45" y="228" fill="#64748b" font-family="monospace" font-size="11">48..55</text>
  <text x="120" y="228" fill="#38bdf8" font-family="monospace" font-size="11">SYS_STATE</text>
  <text x="260" y="228" fill="#cbd5e1" font-family="monospace" font-size="11">3</text>
  <text x="350" y="228" fill="#fff" font-family="monospace" font-size="11">NOMINAL</text>
  <rect x="460" y="216" width="55" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="487" y="228" fill="#10b981" font-size="9" font-family="sans-serif" text-anchor="middle">NOMINAL</text>

  <line x1="35" y1="265" x2="525" y2="265" stroke="#1e293b"/>
  <text x="45" y="258" fill="#64748b" font-family="monospace" font-size="11">56..71</text>
  <text x="120" y="258" fill="#38bdf8" font-family="monospace" font-size="11">BATT_VOLTAGE</text>
  <text x="260" y="258" fill="#cbd5e1" font-family="monospace" font-size="11">8000</text>
  <text x="350" y="258" fill="#fff" font-family="monospace" font-size="11">8.000 V</text>
  <rect x="460" y="246" width="55" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="487" y="258" fill="#10b981" font-size="9" font-family="sans-serif" text-anchor="middle">NOMINAL</text>

  <line x1="35" y1="295" x2="525" y2="295" stroke="#1e293b"/>
  <text x="45" y="288" fill="#64748b" font-family="monospace" font-size="11">72..87</text>
  <text x="120" y="288" fill="#38bdf8" font-family="monospace" font-size="11">BATT_CURRENT</text>
  <text x="260" y="288" fill="#cbd5e1" font-family="monospace" font-size="11">1000</text>
  <text x="350" y="288" fill="#fff" font-family="monospace" font-size="11">+1.000 A</text>
  <rect x="460" y="276" width="55" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="487" y="288" fill="#10b981" font-size="9" font-family="sans-serif" text-anchor="middle">NOMINAL</text>

  <line x1="35" y1="325" x2="525" y2="325" stroke="#1e293b"/>
  <text x="45" y="318" fill="#64748b" font-family="monospace" font-size="11">88..99</text>
  <text x="120" y="318" fill="#38bdf8" font-family="monospace" font-size="11">BUS_3V3_VOLT</text>
  <text x="260" y="318" fill="#cbd5e1" font-family="monospace" font-size="11">3300</text>
  <text x="350" y="318" fill="#fff" font-family="monospace" font-size="11">3.300 V</text>
  <rect x="460" y="306" width="55" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="487" y="318" fill="#10b981" font-size="9" font-family="sans-serif" text-anchor="middle">NOMINAL</text>

  <!-- Telecommand Box -->
  <rect x="35" y="350" width="490" height="150" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="50" y="375" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">TELECOMMAND PACKAGER: CMD_SET_POWER_MODE</text>
  <text x="50" y="405" fill="#94a3b8" font-size="11" font-family="sans-serif">Target Mode: NOMINAL (3)  |  Timeout: 60 Seconds</text>
  <rect x="50" y="420" width="460" height="28" rx="4" fill="#040812" stroke="#1e293b"/>
  <text x="60" y="438" fill="#10b981" font-family="monospace" font-size="11">Encoded Command Frame: EB902003003C (6 Bytes)</text>

  <!-- Right Column: XTCE XML Output -->
  <rect x="560" y="70" width="380" height="445" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="580" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">NORMATIVE XTCE 1.2 XML SCHEMA</text>

  <rect x="580" y="112" width="340" height="385" rx="6" fill="#050914" stroke="#1e293b"/>
  <text x="595" y="136" fill="#64748b" font-family="monospace" font-size="10">&lt;SpaceSystem name="CubeSat_EPS"&gt;</text>
  <text x="595" y="152" fill="#64748b" font-family="monospace" font-size="10">  &lt;Header version="1.2"/&gt;</text>
  <text x="595" y="168" fill="#a5b4fc" font-family="monospace" font-size="10">  &lt;TelemetryMetaData&gt;</text>
  <text x="595" y="184" fill="#a5b4fc" font-family="monospace" font-size="10">    &lt;ParameterTypeSet&gt;</text>
  <text x="595" y="200" fill="#38bdf8" font-family="monospace" font-size="10">      &lt;IntegerParameterType</text>
  <text x="595" y="216" fill="#38bdf8" font-family="monospace" font-size="10">        name="BATT_VOLTAGE_Type"&gt;</text>
  <text x="595" y="232" fill="#cbd5e1" font-family="monospace" font-size="10">        &lt;PolynomialCalibrator&gt;</text>
  <text x="595" y="248" fill="#34d399" font-family="monospace" font-size="10">          &lt;Coefficient exp="1" val="0.001"/&gt;</text>
  <text x="595" y="264" fill="#cbd5e1" font-family="monospace" font-size="10">        &lt;/PolynomialCalibrator&gt;</text>
  <text x="595" y="280" fill="#38bdf8" font-family="monospace" font-size="10">      &lt;/IntegerParameterType&gt;</text>
  <text x="595" y="304" fill="#a5b4fc" font-family="monospace" font-size="10">    &lt;ContainerSet&gt;</text>
  <text x="595" y="320" fill="#f59e0b" font-family="monospace" font-size="10">      &lt;SequenceContainer&gt;</text>
  <text x="595" y="336" fill="#f59e0b" font-family="monospace" font-size="10">        &lt;ParameterRefEntry.../&gt;</text>
  <text x="595" y="352" fill="#f59e0b" font-family="monospace" font-size="10">      &lt;/SequenceContainer&gt;</text>
  <text x="595" y="380" fill="#10b981" font-family="monospace" font-size="11">[10/10 PASS] XTCE NORMATIVE VERIFIED</text>
</svg>
